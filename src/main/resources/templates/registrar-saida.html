<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Saída - Estacionamento</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            background-color: #ffffff;
            padding: 40px 30px;
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-bottom: 24px;
            color: #111827;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            color: #1f2937;
            background-color: #ffffff;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.2);
        }

        /* CARD DE DETALHES DO VEÍCULO */
        .details-card {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #e5e7eb;
            font-size: 14px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #4b5563;
        }

        .detail-value {
            color: #111827;
            font-weight: 500;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        button[type="submit"] {
            flex: 1;
            padding: 12px;
            background-color: #dc2626;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button[type="submit"]:hover {
            background-color: #b91c1c;
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }

        a.btn-cancelar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            background-color: #e5e7eb;
            color: #374151;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        a.btn-cancelar:hover {
            background-color: #d1d5db;
        }
    </style>
</head>
<body>

<div class="card-container">
    <h2>Registrar Saída de Veículo</h2>

    <div class="form-group">
        <label for="placa">Selecione a Placa:</label>
        <select id="placa" onchange="selecionarVeiculo(this.value)">
            <option value="">-- Selecione um veículo --</option>
            <option th:each="v : ${veiculos}"
                    th:value="${v.id}"
                    th:text="${v.placa}"
                    th:selected="${veiculo != null and veiculo.id == v.id}">
            </option>
        </select>
    </div>

    <!-- Exibe os detalhes do veículo caso um esteja selecionado -->
    <div th:if="${veiculo != null}" class="details-card">
        <div class="detail-row">
            <span class="detail-label">Placa:</span>
            <span class="detail-value" th:text="${veiculo.placa}">ABC-1234</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Modelo:</span>
            <span class="detail-value" th:text="${veiculo.modelo}">Modelo</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Cor:</span>
            <span class="detail-value" th:text="${veiculo.cor}">Cor</span>
        </div>
    </div>

    <div class="actions">
        <a th:href="@{/autenticar}" class="btn-cancelar">Voltar</a>

        <form th:if="${veiculo != null}" th:action="@{/veiculo/confirmar-saida}" method="post" style="flex: 1;">
            <input type="hidden" name="id" th:value="${veiculo.id}">
            <button type="submit" style="width: 100%;">Confirmar Saída</button>
        </form>
    </div>
</div>

</body>
</html>
