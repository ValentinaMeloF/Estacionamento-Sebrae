<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estacionamento</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background-color: #ffffff;
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        h2 {
            margin-bottom: 24px;
            color: #111827;
            font-size: 24px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            color: #1f2937;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #ec4899;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #ec4899;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 6px;
        }

        button:hover {
            background-color: #db2777;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Mensagem de Erro de Autenticação */
        .alert-error {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
        }

        p {
            margin-top: 24px;
            color: #6b7280;
            font-size: 14px;
        }

        a {
            color: #ec4899;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Entrar no Sistema</h2>

    <div th:if="${erro}" class="alert-error" th:text="${erro}">
        E-mail ou senha inválidos.
    </div>

    <form th:action="@{/autenticar}" method="post">
        <div class="form-group">
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required autocomplete="email">
        </div>

        <div class="form-group">
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required autocomplete="current-password">
        </div>

        <button type="submit">Acessar</button>

        <p>Não tem cadastro? <a th:href="@{/cadastro}">Clique aqui</a></p>
    </form>
</div>

</body>
</html>
